[package]
name = "td"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.37", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.36", features = ["formatting", "parsing"] }
uuid = { version = "1.20.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"
